name: Update blog posts

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          feed_list: "https://k-o.pro/rss.xml"
          max_post_count: 4
          template: "• [$title]($url) - $date<br>"
          date_format: "mmm dd, yyyy"
          tag_post_pre_newline: "true"
